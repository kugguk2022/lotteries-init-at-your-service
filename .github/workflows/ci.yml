name: ci

on:
  push:
  pull_request:

jobs:
  core-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install LottoBench core
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,api]"
      - name: Ruff
        run: ruff check .
      - name: Core tests
        run: pytest -q --maxfail=1 --disable-warnings --cov=lotteries_core
      - name: Offline core journey
        run: python -m scripts.validate_user_journey
      - name: Reject placeholders in changed Python
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          base_sha="${PR_BASE_SHA:-$PUSH_BASE_SHA}"
          if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          mapfile -t changed < <(git diff --name-only --diff-filter=ACMR "$base_sha" HEAD -- '*.py')
          if ((${#changed[@]})) && grep -n \
            -e '^[[:space:]]*pass[[:space:]]*$' \
            -e '^[[:space:]]*\.\.[[:space:]]*$' \
            "${changed[@]}"; then
            echo "Found placeholder 'pass' or '...' in changed code. Refuse to merge."
            exit 1
          fi

  experiments-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install experiment dependencies
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,api,ml,repo-test]"
      - name: Test preserved experiments separately
        run: pytest -q experiments/tests --maxfail=1 --disable-warnings

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build source and wheel distributions
        run: |
          rm -rf dist build
          python -m pip install -U pip build twine
          rm -rf dist/
          python -m build
      - name: Validate metadata and archive contents
        run: |
          python -m twine check dist/*
          python scripts/check_distribution.py dist/*
      - name: Install and smoke-test the base wheel
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/lottobench-wheel"
          "$RUNNER_TEMP/lottobench-wheel/bin/python" -m pip install -U pip
          "$RUNNER_TEMP/lottobench-wheel/bin/python" -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/lottobench-wheel/bin/python" "$GITHUB_WORKSPACE/scripts/wheel_smoke.py"
      - uses: actions/upload-artifact@v4
        with:
          name: lottobench-python-distributions
          path: dist/
