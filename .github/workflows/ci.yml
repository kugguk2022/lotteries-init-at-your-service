name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      # Repository-wide. The former changed-files-only gate existed because `ruff check .` was red;
      # the legacy debt is now either fixed or scoped to explicit per-file-ignores in pyproject.toml,
      # so the whole tree is gated and cannot silently regress.
      - name: Ruff (whole repository)
        run: ruff check .

      # Also repository-wide. Previously only four files blocked and the full suite ran with
      # continue-on-error; both uncollectable modules are fixed, so the real suite is the gate.
      - name: Pytest (whole suite, with core coverage)
        # Keep functional and dataset failures visible even when inherited lint debt is red.
        # This does not weaken the job: an earlier Ruff failure still makes the job fail.
        if: ${{ !cancelled() }}
        run: pytest -q --maxfail=1 --disable-warnings --cov=lotteries_core

      - name: Fail on placeholders in changed Python files
        # Run the structural guard after either Ruff or pytest fails so no failure masks it.
        if: ${{ !cancelled() }}
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          base_sha="${PR_BASE_SHA:-$PUSH_BASE_SHA}"
          if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          mapfile -t changed < <(git diff --name-only --diff-filter=ACMR "$base_sha" HEAD -- '*.py')
          if ((${#changed[@]})) && grep -n \
            -e '^[[:space:]]*pass[[:space:]]*$' \
            -e '^[[:space:]]*\.\.[[:space:]]*$' \
            "${changed[@]}"; then
            echo "Found placeholder 'pass' or '...' in changed code. Refuse to merge."
            exit 1
          fi
