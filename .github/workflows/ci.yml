name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Ruff changed Python files
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          base_sha="${PR_BASE_SHA:-$PUSH_BASE_SHA}"
          if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          mapfile -t changed < <(git diff --name-only --diff-filter=ACMR "$base_sha" HEAD -- '*.py')
          if ((${#changed[@]})); then
            ruff check "${changed[@]}"
          else
            echo "No changed Python files."
          fi

      - name: Pytest maintained core (with coverage)
        run: |
          pytest -q --maxfail=1 --disable-warnings --cov=lotteries_core \
            tests/test_outcome_tracking.py \
            tests/test_core_inference.py \
            tests/test_benchmark_regression.py \
            tests/test_causal_poi.py

      - name: Legacy full-suite audit (non-blocking until baseline debt is repaired)
        continue-on-error: true
        run: pytest -q --maxfail=1 --disable-warnings

      - name: Fail on placeholders
        run: |
          if grep -R -n --include="*.py" -e '^[[:space:]]*pass[[:space:]]*$' -e '^[[:space:]]*\.\.[[:space:]]*$' . ; then
            echo "Found placeholder 'pass' or '...' in code. Refuse to merge.";
            exit 1;
          fi
