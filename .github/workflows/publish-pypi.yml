name: publish-pypi

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require tag and package versions to match
        run: |
          expected="v$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          test "${GITHUB_REF_NAME}" = "${expected}"
      - name: Build and validate distributions
        run: |
          python -m pip install -U pip build twine
          python -m build
          python -m twine check dist/*
          python scripts/check_distribution.py dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: lottobench-python-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lottobench
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lottobench-python-distributions
          path: dist/
      - name: Publish through Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
