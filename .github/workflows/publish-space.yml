name: publish-lottery-space

# Twice weekly, after the official draw windows:
# - Wednesday morning follows Tuesday EuroMillions.
# - Sunday morning follows Friday EuroMillions and Saturday Nederlandse Lotto.
# GitHub cron is UTC, so 08:15 remains a London morning through DST changes.
on:
  schedule:
    - cron: "15 8 * * 0,3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-lottobench-space
  cancel-in-progress: false

env:
  SPACE_ID: kugguk/lottobench-community-leaderboard
  SPACE_HOST: https://kugguk-lottobench-community-leaderboard.hf.space

jobs:
  refresh-validate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install LottoBench and Hugging Face CLI
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "huggingface_hub>=1.0,<2"

      - name: Fetch post-contest histories with retry
        shell: bash
        run: |
          set -euo pipefail
          database="$RUNNER_TEMP/lotteries.db"

          fetch_game() {
            local game="$1"
            for attempt in 1 2 3; do
              if lottobench fetch \
                --game "$game" \
                --db "$database" \
                --no-cache \
                --timeout 45; then
                return 0
              fi
              if [[ "$attempt" -lt 3 ]]; then
                sleep "$((attempt * 30))"
              fi
            done
            echo "Failed to fetch $game after three attempts" >&2
            return 1
          }

          fetch_game euromillions
          fetch_game nl-lotto

      - name: Rebuild all Space profiles
        run: |
          python -m scripts.build_space_profiles \
            --db "$RUNNER_TEMP/lotteries.db" \
            --out publishing/huggingface-space/data/profiles

      - name: Validate generated profiles and Space code
        run: |
          ruff check publishing/huggingface-space/app.py scripts/build_space_profiles.py
          python -m py_compile publishing/huggingface-space/app.py
          pytest -q tests/test_space_profiles.py tests/test_benchmark_output_contract.py

      - name: Publish validated bundle to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || {
            echo "Repository secret HF_TOKEN is required and must have write access to $SPACE_ID" >&2
            exit 1
          }
          hf upload "$SPACE_ID" \
            publishing/huggingface-space \
            . \
            --repo-type space \
            --commit-message "Scheduled post-draw refresh ${GITHUB_RUN_ID}"

      - name: Wait for Space and verify public health
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          hf spaces wait "$SPACE_ID" --timeout 15m
          curl --fail --silent --show-error \
            --retry 8 \
            --retry-delay 15 \
            --retry-all-errors \
            --max-time 30 \
            "$SPACE_HOST" >/dev/null

      - name: Publish refresh summary
        if: always()
        shell: bash
        run: |
          {
            echo "## LottoBench Space refresh"
            echo
            echo "- Schedule: Wednesday and Sunday at 08:15 UTC"
            echo "- Space: $SPACE_ID"
            echo "- Run: $GITHUB_RUN_ID"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
