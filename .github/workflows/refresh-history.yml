name: verify-history-refresh

# A diagnostic only. Runtime draw data belongs in the user's ignored SQLite database; this workflow
# deliberately never commits generated data, opens a PR, or triggers the repository CI workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Exercise a fresh local SQLite refresh
        run: python scripts/refresh_history.py --out /tmp/lotteries.db --game euromillions

      - name: Verify database provenance
        run: python scripts/refresh_history.py --check --out /tmp/lotteries.db --game euromillions
