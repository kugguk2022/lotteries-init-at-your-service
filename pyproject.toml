[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lotteries-core"
version = "0.1.0a1"
description = "Auditable, equal-budget competition across lottery inference providers"
readme = { file = "README.pypi.md", content-type = "text/markdown" }
requires-python = ">=3.10"
authors = [{ name = "kugguk2022" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["lottery", "inference", "provenance", "roi", "benchmarking"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.25",
  "pandas>=2.0",
]

[project.optional-dependencies]
ml = [
  "scikit-learn>=1.3.0",
  "torch>=2.0.0",
  "xgboost>=2.0.0",
]
api = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",   # also the FastAPI TestClient transport
]
dev = [
  "ruff>=0.14.5,<0.15",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.8",
]
release = [
  "build>=1.2",
  "twine>=6.0",
]

[project.urls]
Homepage = "https://github.com/kugguk2022/lotteries-init-at-your-service"
Issues = "https://github.com/kugguk2022/lotteries-init-at-your-service/issues"
Discussions = "https://github.com/kugguk2022/lotteries-init-at-your-service/discussions"

[project.scripts]
lotto-benchmark = "lotteries_core.benchmark:main"
lotto-likely-sets = "lotteries_core.likely_set_generator:main"
lotto-track = "lotteries_core.outcome_tracker:main"
lotto-serve = "lotteries_core.api:main"          # needs the [api] extra

[tool.setuptools.packages.find]
include = ["lotteries_core", "lotteries_core.*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

# Acknowledged legacy debt, scoped to the exact files that carry it, so `ruff check .` is a real
# gate for everything else instead of being permanently red. Each entry is a promise to clean up,
# not a blanket exemption: do not add new files here, and delete an entry once its file is fixed.
#
# F841: research scripts that compute intermediates for interactive inspection and no longer use
#       them. Removing them blind risks deleting a deliberate calculation, so they are left for
#       whoever next works in that script with the context to judge.
# E402: single-file scripts that interleave module-level analysis code with imports.
[tool.ruff.lint.per-file-ignores]
"euromillions/arithmetic_branch.py" = ["F841"]
"euromillions/branch_hmm_v3.py" = ["F841"]
"euromillions/garch_glm_diagnostics.py" = ["F841"]
"euromillions/garchx_glm.py" = ["F841"]
"euromillions/roi.py" = ["F841"]
"euromillions_agent/lotto_lab.py" = ["F841"]
"eurodreams/eurodreams_get_draws.py" = ["E402"]
"grok.py" = ["E402"]
"totoloto/grok.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
strict_optional = false
ignore_missing_imports = true
