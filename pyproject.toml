[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mslt-lottery"
version = "0.1.0"
description = "Experimental local multi-strategy lottery testing toolkit; not betting advice"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
authors = [{ name = "kugguk2022" }]
license = { file = "LICENSE" }
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "requests>=2.31",
  "pandas>=2.0",
  "numpy>=1.25",
  "python-dateutil>=2.8.2",
  "pandera>=0.20",
  "pyarrow>=15.0",
  "scikit-learn>=1.3.0",
  "statsmodels>=0.14.0",
  "beautifulsoup4>=4.12.0",
  "scipy>=1.10.0",
  "matplotlib>=3.7.0",
  "seaborn>=0.13.0",
]

[project.optional-dependencies]
ml = [
  "torch>=2.0.0",
  "xgboost>=2.0.0",
]
api = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",   # also the FastAPI TestClient transport
]
dev = [
  "ruff>=0.14.5,<0.15",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/kugguk2022/lotteries-init-at-your-service"
Issues = "https://github.com/kugguk2022/lotteries-init-at-your-service/issues"
Discussions = "https://github.com/kugguk2022/lotteries-init-at-your-service/discussions"

[project.scripts]
mslt = "mslt.cli:main"
lotto-get-draws = "euromillions.get_draws:main"
lotto-likely-sets = "lotteries_core.likely_set_generator:main"
lotto-track = "lotteries_core.outcome_tracker:main"
lotto-serve = "lotteries_core.api:main"          # needs the [api] extra
# Enable later when implemented:
# lotto-roi = "euromillions.roi:main"

[tool.setuptools.packages.find]
include = ["mslt", "mslt.*", "euromillions", "totoloto", "eurodreams", "euromillions_agent", "lotteries_core", "lotteries_core.*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

# Acknowledged legacy debt, scoped to the exact files that carry it, so `ruff check .` is a real
# gate for everything else instead of being permanently red. Each entry is a promise to clean up,
# not a blanket exemption: do not add new files here, and delete an entry once its file is fixed.
#
# F841: research scripts that compute intermediates for interactive inspection and no longer use
#       them. Removing them blind risks deleting a deliberate calculation, so they are left for
#       whoever next works in that script with the context to judge.
# E402: single-file scripts that interleave module-level analysis code with imports.
[tool.ruff.lint.per-file-ignores]
"euromillions/arithmetic_branch.py" = ["F841"]
"euromillions/branch_hmm_v3.py" = ["F841"]
"euromillions/garch_glm_diagnostics.py" = ["F841"]
"euromillions/garchx_glm.py" = ["F841"]
"euromillions/roi.py" = ["F841"]
"euromillions_agent/lotto_lab.py" = ["F841"]
"eurodreams/eurodreams_get_draws.py" = ["E402"]
"grok.py" = ["E402"]
"totoloto/grok.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
strict_optional = false
ignore_missing_imports = true
